[package]
name = "alolite-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description = "UI-independent Zalo protocol, CoreEngine, SQLite store, and MCP runtime"

[dependencies]
# Cryptography & Network Encoding
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
rsa = "0.9.10"
generic-array = "0.14"

# Trusted-device protocol (Curve25519 identity keys, XEdDSA, linking MAC)
curve25519-dalek = { version = "4", features = ["digest"] }
hmac = "0.13"
subtle = "2"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }

# Serialization & Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
qrcode = { version = "0.14.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

# Compression
flate2 = "1"
lzma-rs = "0.3.0"
zstd = "0.14.3"

# Networking & Async Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Local SQLite Storage
rusqlite = { version = "0.32", features = ["bundled"] }
