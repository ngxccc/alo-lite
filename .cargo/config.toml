[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[alias]
dev = "run --bin alolite"
dev-qr = "run --bin alolite -- --qr"
dev-tui = "run --bin alolite -- --tui"
build-release = "build --release --bin alolite"
release = "build --release --bin alolite"
lint = "clippy --all-targets"
fmt-check = "fmt --all -- --check"
pkg = "!./packaging/linux/package-all.sh"
docs = "doc -p alolite-core --no-deps --document-private-items --open"
