<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Oceanic to Vibrant Electric Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Top Rim Light -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Chat Bubble Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F7FF"/>
    </linearGradient>

    <!-- Unified Seamless 'A' Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Ambient Shadow for squircle -->
    <filter id="canvasShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.5"/>
    </filter>

    <!-- Bubble Drop Shadow -->
    <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0C2366" flood-opacity="0.3"/>
    </filter>

    <!-- Glyph Inner Depth -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0C2366" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 1. Base Squircle -->
  <rect x="44" y="44" width="424" height="424" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#canvasShadow)"/>

  <!-- 2. Rim Highlight -->
  <rect x="46" y="46" width="420" height="420" rx="102" ry="102" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>

  <!-- 3. Primary Speech Bubble with smooth organic tail -->
  <g filter="url(#bubbleShadow)">
    <path d="M 160 128
             C 116 128, 96 156, 96 200
             L 96 280
             C 96 324, 120 352, 164 352
             L 196 352
             L 172 396
             C 166 406, 175 418, 187 414
             L 264 352
             L 348 352
             C 392 352, 416 324, 416 280
             L 416 200
             C 416 156, 392 128, 348 128
             Z"
          fill="url(#bubbleGrad)"/>
  </g>

  <!-- 4. Pure Unified Geometric "A" Glyph (Single seamless path with integrated crossbar) -->
  <g filter="url(#glyphShadow)">
    <path fill-rule="evenodd"
          d="M 256 154
             C 260 154, 264 157, 267 163
             L 334 308
             C 339 318, 332 330, 321 330
             L 295 330
             C 290 330, 285 326, 282 320
             L 268 288
             L 244 288
             L 230 320
             C 227 326, 222 330, 217 330
             L 191 330
             C 180 330, 173 318, 178 308
             L 245 163
             C 248 157, 252 154, 256 154
             Z
             M 256 200
             L 272 262
             L 240 262
             Z"
          fill="url(#glyphGrad)"/>
  </g>
</svg>
