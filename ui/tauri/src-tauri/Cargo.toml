[package]
name = "alolite-tauri"
version = "0.0.1"
description = "AloLite Desktop UI Host (Tauri v2 + TypeScript)"
authors = ["ngxc dev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
alolite = { path = "../../.." }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
