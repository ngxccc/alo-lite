version: 2
updates:
  # ── Cargo (Rust Dependencies) ──
  # Group all non-breaking updates (minor and patch) into a single weekly PR.
  # Major version updates (breaking API changes) are excluded so automated PRs do not break CI.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── GitHub Actions Workflows & Composite Actions ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-updates:
        patterns: ["*"]
