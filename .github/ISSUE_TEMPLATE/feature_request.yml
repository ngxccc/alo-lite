name: "Feature Request"
description: "Suggest an idea, enhancement, or architectural improvement"
title: "feat(<scope>): <summary>"
labels: ["type:feat"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an enhancement or new capability for Alolite.
        
        *Note: Out-of-scope non-core features (VoIP, Video Feed, Multi-platform Windows/macOS wrappers) will be closed as wontfix.*
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: "One-sentence observable behavior or state when complete (not file inventory)."
      placeholder: "e.g. Alolite supports rendering custom sticker sets fetched from Zalo CDN with animated WebP previews."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Background, motivation, or limitation being addressed."
      placeholder: "e.g. Currently stickers only show static placeholders, missing animated preview support."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: "Checklist of measurable conditions required for completion."
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: "Explicit non-goals to prevent scope creep."
      placeholder: "e.g. Do not implement sticker store purchase flows or VoIP reactions."
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: "Select the primary architectural domain."
      options:
        - "area:core (engine, services, runtime, common)"
        - "area:protocol (wire, crypto, socket, endpoints, registry)"
        - "area:auth (QR/password login, trusted device, session)"
        - "area:net (HTTP failover, WebSocket framing, ParamCipher v2)"
        - "area:chat (threads, message identity, reactions, recall)"
        - "area:store (SQLite schema, migrations, cache)"
        - "area:mcp (MCP server, REST daemon, autoreply)"
        - "area:ui (Tauri v2 host & React frontend)"
        - "area:cli (command-line interface, terminal QR)"
        - "area:packaging (Linux .deb, .rpm, .AppImage, tarball)"
        - "area:assets (desktop icons, SVGs, branding)"
        - "area:docs (documentation book, ADRs, standards, README)"
        - "area:ci (GitHub Actions workflows)"
        - "area:harness (AGENTS.md, AI tooling, scripts)"
    validations:
      required: true
