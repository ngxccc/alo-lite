name: "Setup Bun Environment"
description: "Bootstraps Bun runtimes with dependency caching"

inputs:
  bun-version:
    description: "Bun version to install"
    required: false
    default: "latest"
  cache:
    description: "Enable caching for Bun install cache"
    required: false
    default: "true"
  lockfile:
    description: "Path to lockfile for cache key"
    required: false
    default: "apps/desktop/bun.lock"

runs:
  using: "composite"
  steps:
    - name: Check pre-installed Bun
      id: check-bun
      shell: bash
      run: |
        if command -v bun >/dev/null 2>&1; then
          echo "has_bun=true" >> "$GITHUB_OUTPUT"
          echo "Bun already installed ($(bun --version))."
        else
          echo "has_bun=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      if: steps.check-bun.outputs.has_bun != 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Cache Bun Dependencies
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles(inputs.lockfile) }}
        restore-keys: |
          ${{ runner.os }}-bun-
