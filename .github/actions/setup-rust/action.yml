name: "Setup Rust Environment"
description: "Bootstraps Rust toolchain, high-performance rust-cache, optional sccache, mold linker, and system dependencies"

inputs:
  components:
    description: "Rust components to install (e.g. rustfmt, clippy)"
    required: false
    default: ""
  cache:
    description: "Enable Swatinem/rust-cache"
    required: false
    default: "true"
  cache-targets:
    description: "Cache the target/ directory (false for fast PR/test jobs, true for full builds)"
    required: false
    default: "false"
  cache-all-crates:
    description: "Cache all crates in the cargo cache"
    required: false
    default: "true"
  sccache:
    description: "Enable Mozilla sccache with GitHub Actions cache backend"
    required: false
    default: "false"
  gui-dependencies:
    description: "Install Linux WebKitGTK and GTK-3 GUI build dependencies"
    required: false
    default: "false"
  packaging-tools:
    description: "Install additional Linux packaging tools (rpm, desktop-file-utils, libfuse2, patchelf, etc.)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # No cargo invocation allowed before this.
    # In a pre-built container, RUSTC_WRAPPER=sccache is already set,
    # so the very first `cargo` call (from rust-toolchain action or
    # Swatinem/rust-cache) will start the sccache daemon. If the GHA
    # cache URL isn't visible, the daemon fails and the job dies.
    - name: Configure sccache
      id: sccache-preconfig
      shell: bash
      run: |
        if [ "${{ inputs.sccache }}" != "true" ]; then
          # Container may have RUSTC_WRAPPER=sccache baked in — neutralize it
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          echo "gha_available=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # sccache v0.19 reads ACTIONS_CACHE_URL, not ACTIONS_RESULTS_URL.
        # Newer container jobs only inject the latter — map one to the other.
        cache_url="${ACTIONS_CACHE_URL:-}"
        if [ -z "$cache_url" ] && [ -n "${ACTIONS_RESULTS_URL:-}" ]; then
          cache_url="${ACTIONS_RESULTS_URL}"
          echo "ACTIONS_CACHE_URL=${cache_url}" >> "$GITHUB_ENV"
          echo "Mapped ACTIONS_RESULTS_URL → ACTIONS_CACHE_URL"
        fi

        if [ -n "$cache_url" ]; then
          echo "gha_available=true" >> "$GITHUB_OUTPUT"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        else
          echo "gha_available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::sccache: no ACTIONS_CACHE_URL / ACTIONS_RESULTS_URL available — using local disk cache only"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
        fi

    # avoid `rustc --version` unguarded — if some wrapper path
    # ever routes through sccache, we don't want the probe step to die.
    - name: Check pre-installed toolchain
      id: check-env
      shell: bash
      run: |
        if command -v cargo >/dev/null 2>&1 && command -v rustc >/dev/null 2>&1; then
          echo "has_rust=true" >> "$GITHUB_OUTPUT"
          echo "Rust toolchain already installed ($(rustc --version 2>/dev/null || echo unknown))."
        else
          echo "has_rust=false" >> "$GITHUB_OUTPUT"
        fi
        if command -v sccache >/dev/null 2>&1; then
          echo "has_sccache=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_sccache=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Rust toolchain
      if: steps.check-env.outputs.has_rust != 'true'
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: ${{ inputs.components }}

    - name: Setup sccache
      if: inputs.sccache == 'true' && steps.check-env.outputs.has_sccache != 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Finalize sccache configuration
      if: inputs.sccache == 'true'
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        if [ "${{ steps.sccache-preconfig.outputs.gha_available }}" = "true" ]; then
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        else
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
        fi

    - name: High-performance Rust Cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: "alolite-cargo-cache"
        cache-targets: ${{ inputs.cache-targets }}
        cache-all-crates: ${{ inputs.cache-all-crates }}
        cache-on-failure: "true"

    - name: Ensure mold and clang linker
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v mold >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mold clang
        fi

    - name: Install Linux GUI build dependencies
      if: runner.os == 'Linux' && inputs.gui-dependencies == 'true'
      shell: bash
      run: |
        if ! pkg-config --exists webkit2gtk-4.1; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev libasound2-dev
        else
          echo "WebKitGTK and GUI dependencies already present (container or system)."
        fi

    - name: Install Linux packaging tools
      if: runner.os == 'Linux' && inputs.packaging-tools == 'true'
      shell: bash
      run: |
        if ! command -v rpmbuild >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            rpm file desktop-file-utils libfuse2 jq patchelf \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev
        else
          echo "Packaging tools already present (container or system)."
        fi
