name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  check-release:
    name: Detect & Tag Release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect release commit
        id: detect
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "Direct tag push detected: ${{ github.ref_name }}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Workflow dispatch release: ${{ inputs.tag_name }}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "Recent commit message: $COMMIT_MSG"
            if [[ "$COMMIT_MSG" =~ chore\(release\):[[:space:]]*v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              TAG="v${BASH_REMATCH[1]}"
              echo "Matched release commit for tag: $TAG"
              if git rev-parse "$TAG" >/dev/null 2>&1; then
                echo "Tag $TAG already exists, skipping."
                echo "should_release=false" >> "$GITHUB_OUTPUT"
              else
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git tag -a "$TAG" -m "AloLite Release $TAG"
                git push origin "$TAG"
                echo "Created and pushed tag $TAG"
                echo "should_release=true" >> "$GITHUB_OUTPUT"
                echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "Not a release commit, skipping release workflow."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  ci-gate:
    name: CI Gate
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Packages
    needs: [check-release, ci-gate]
    if: needs.check-release.outputs.should_release == 'true'
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish Release
    needs: [check-release, build]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: alolite-linux-packages
          path: release_assets

      - name: Checksums
        run: ./scripts/generate-checksums.sh release_assets

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-release.outputs.tag_name }}
          name: AloLite Release ${{ needs.check-release.outputs.tag_name }}
          files: release_assets/*
          generate_release_notes: true
