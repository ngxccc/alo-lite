name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  check-release:
    name: Detect & Tag Release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect and tag release
        id: detect
        run: ./scripts/detect-and-tag-release.sh "${{ github.ref_type }}" "${{ github.ref_name }}" "${{ github.event_name }}" "${{ inputs.tag_name }}"

  ci-gate:
    name: CI Gate
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Packages
    needs: [check-release, ci-gate]
    if: needs.check-release.outputs.should_release == 'true'
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish Release
    needs: [check-release, build]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: alolite-linux-packages
          path: release_assets

      - name: Checksums
        run: ./scripts/generate-checksums.sh release_assets

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-release.outputs.tag_name }}
          name: AloLite Release ${{ needs.check-release.outputs.tag_name }}
          files: release_assets/*
          generate_release_notes: true
