name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Packages
    needs: ci-gate
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: alolite-linux-packages
          path: release_assets

      - name: Checksums
        run: ./scripts/generate-checksums.sh release_assets

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: AloLite Release ${{ github.ref_name || inputs.tag_name }}
          files: release_assets/*
          generate_release_notes: true
