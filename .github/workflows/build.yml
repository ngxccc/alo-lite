name: Build Linux Packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "packaging/**"
      - "Cargo.*"
      - ".github/workflows/build.yml"
      - ".github/setup-rust/**"
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-packages:
    name: Package Linux (.deb / .rpm / .AppImage / .tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust & packaging tools
        uses: ./.github/setup-rust
        with:
          packaging-tools: "true"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Build binary and all Linux packages
        run: ./packaging/linux/package-all.sh

      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: alolite-linux-packages
          path: dist/*
          retention-days: 7
