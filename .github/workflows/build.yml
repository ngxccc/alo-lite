name: Build Linux Packages

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - ".vscode/**"
  pull_request:
    paths:
      - "packaging/**"
      - "crates/alolite-desktop/tauri.conf.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "apps/desktop/package.json"
      - ".github/workflows/build.yml"
      - ".github/actions/**"
      - ".cargo/config.toml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-packages:
    name: Package Linux
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/${{ github.repository }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust & Packaging Tools
        uses: ./.github/actions/setup-rust
        with:
          packaging-tools: "true"
          gui-dependencies: "true"
          sccache: "true"
          cache-targets: "false"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Package
        run: ./packaging/linux/package-all.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: alolite-linux-packages
          path: dist/*
          retention-days: 7
