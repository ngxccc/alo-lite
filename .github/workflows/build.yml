name: Build Linux Packages

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - ".vscode/**"
  pull_request:
    paths:
      - "packaging/**"
      - "crates/alolite-desktop/tauri.conf.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "apps/desktop/package.json"
      - ".github/workflows/build.yml"
      - ".github/setup-rust/**"
      - ".cargo/config.toml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-packages:
    name: Package Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          packaging-tools: "true"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/desktop/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Package
        run: ./packaging/linux/package-all.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: alolite-linux-packages
          path: dist/*
          retention-days: 7
