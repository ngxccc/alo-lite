name: Security Scan

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - ".vscode/**"
      - "assets/**"
      - ".github/assets/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - ".vscode/**"
      - "assets/**"
      - ".github/assets/**"

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: "vuln,config,secret"
          ignore-unfixed: true
          exit-code: "0"
          cache: true
          version: v0.71.0

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.39.2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "actions"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init
        uses: github/codeql-action/init@v4.39.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v4.39.2
        with:
          category: "/language:${{matrix.language}}"
