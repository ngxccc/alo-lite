name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust & dependencies
        uses: ./.github/setup-rust
        with:
          components: "rustfmt, clippy"

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Linter (Core & CLI)
        run: cargo clippy -p alolite-core -p alolite-cli --all-targets -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test -p alolite-core -p alolite-cli --locked
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/desktop/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Desktop Frontend Check & Tests
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test
          bun run build
