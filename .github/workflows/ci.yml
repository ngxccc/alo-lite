name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - ".vscode/**"
      - "assets/**"
      - ".github/assets/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - ".vscode/**"
      - "assets/**"
      - ".github/assets/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          components: "rustfmt, clippy"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p alolite-core -p alolite-cli --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p alolite-core -p alolite-cli --locked

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/desktop/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Check Versions
        run: bun scripts/version.ts check

      - name: Check Frontend
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test
          bun run build
