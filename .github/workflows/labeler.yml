name: "PR Area Labeler"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-area-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: "Label from modified file paths"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
