name: "PR Type Label"

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-type-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Type Labeler
    runs-on: ubuntu-22.04
    steps:
      - name: Sync Type Label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const PREFIX_TO_LABEL = {
              feat: "type:feat",
              fix: "type:fix",
              perf: "type:perf",
              refactor: "type:refactor",
              docs: "type:docs",
              test: "type:test",
              ci: "type:ci",
              chore: "type:chore",
              build: "type:chore",
              style: "type:style",
              core: "type:refactor",
              security: "type:fix",
            };
            const MANAGED = new Set(Object.values(PREFIX_TO_LABEL));
            const SPLIT_LABEL = "status:needs-split";

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // 1. Scan all commits in the PR
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const commitTypes = new Set();
            for (const item of commits) {
              const title = item.commit.message.split("\n")[0].trim();
              const match = /^(\w+)(?:\([^)]*\))?!?:/.exec(title);
              if (match) {
                const rawType = match[1].toLowerCase();
                if (PREFIX_TO_LABEL[rawType]) {
                  commitTypes.add(PREFIX_TO_LABEL[rawType]);
                }
              }
            }

            const current = pr.labels.map((label) => label.name);
            const typeList = Array.from(commitTypes);

            // 2. Warn if multiple types detected
            if (typeList.length > 1) {
              const warningMsg = `⚠️ Warning: PR #${pr.number} contains ${typeList.length} different commit types: [${typeList.join(", ")}]. A single PR should focus on a single conventional type. Consider splitting into focused, single-purpose PRs.`;
              core.warning(warningMsg);

              if (!current.includes(SPLIT_LABEL)) {
                try {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: pr.number,
                    labels: [SPLIT_LABEL],
                  });
                  core.info(`Added ${SPLIT_LABEL}`);
                } catch (err) {
                  core.warning(`Failed to add ${SPLIT_LABEL}: ${err.message}`);
                }
              }
            } else {
              if (current.includes(SPLIT_LABEL)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pr.number,
                    name: SPLIT_LABEL,
                  });
                  core.info(`Removed ${SPLIT_LABEL}`);
                } catch (err) {
                  if (err.status !== 404) core.warning(`Failed to remove ${SPLIT_LABEL}: ${err.message}`);
                }
              }
            }

            // 3. Keep exactly one primary type label in sync with PR title
            const match = /^(\w+)(?:\([^)]*\))?!?:/.exec(pr.title);
            const wanted = match && PREFIX_TO_LABEL[match[1].toLowerCase()];

            if (!wanted) {
              core.info(`"${pr.title}" has no conventional prefix; leaving type labels alone.`);
              return;
            }

            for (const name of current) {
              if (!MANAGED.has(name) || name === wanted) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name,
                });
                core.info(`Removed ${name}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [wanted],
              });
              core.info(`Added ${wanted}`);
            }
