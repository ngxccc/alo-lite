changelog:
  exclude:
    labels:
      - dependencies
      - github_actions
  categories:
    - title: Features
      labels:
        - type:feat
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - type:fix
        - type:bug
        - bug
    - title: Performance
      labels:
        - type:perf
        - performance
    - title: Refactors
      labels:
        - type:refactor
        - refactor
    - title: Security
      labels:
        - security
    - title: CI
      labels:
        - type:ci
        - type:chore
        - CI
    - title: Documentation
      labels:
        - type:docs
        - documentation
    - title: Tests
      labels:
        - type:test
        - test
    - title: Other Changes
      labels:
        - "*"
