name: "Setup Rust Environment"
description: "Bootstraps Rust toolchain, high-performance Swatinem/rust-cache, and Linux system dependencies"

inputs:
  components:
    description: "Rust components to install (e.g. rustfmt, clippy)"
    required: false
    default: ""
  cache:
    description: "Enable Swatinem/rust-cache"
    required: false
    default: "true"
  cache-all-crates:
    description: "Cache all crates in the cargo cache"
    required: false
    default: "true"
  packaging-tools:
    description: "Install additional Linux packaging tools (rpm, desktop-file-utils, libfuse2, jq)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - name: High-performance Rust Cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        cache-targets: "true"
        cache-all-crates: ${{ inputs.cache-all-crates }}
        cache-on-failure: "true"
    - name: Install system build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake pkg-config \
          libxcb-render0-dev libxcb-shape0-dev \
          libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
          libgtk-3-dev libasound2-dev

    - name: Install Linux packaging tools
      if: inputs.packaging-tools == 'true'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          rpm file desktop-file-utils libfuse2 jq patchelf \
          libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
          libayatana-appindicator3-dev libxdo-dev
