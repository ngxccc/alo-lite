[book]
title = "AloLite"
description = "Documentation for AloLite — Lightweight native desktop messaging client"
authors = ["ngxc"]
language = "en"
src = "."

[build]
build-dir = "../book"

[output.html]
default-theme = "dark"
site-url = "/alolite/"
git-repository-url = "https://github.com/ngxccc/alolite"
edit-url-template = "https://github.com/ngxccc/alolite/edit/main/docs/{path}"

[output.html.search]
enable = true
