[package]
name = "alolite"
version = "0.0.1"
edition = "2021"
authors = ["ngxc <ngoc.dev@gmail.com>"]
description = "Lightweight, high-performance native desktop messaging client written in Rust (zero Node.js, zero Electron)"
homepage = "https://github.com/ngxccc/alolite"
repository = "https://github.com/ngxccc/alolite"
license = "MIT OR Apache-2.0"
default-run = "alolite"

[dependencies]
# Cryptography & Network Encoding
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
rsa = "0.9.10"
generic-array = "0.14"
# Trusted-device protocol (Curve25519 identity keys, XEdDSA, linking MAC)
curve25519-dalek = { version = "4", features = ["digest"] }
hmac = "0.12"
subtle = "2"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }

# Serialization & Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
qrcode = { version = "0.14.1", default-features = false }

# Compression
flate2 = "1"
lzma-rs = "0.3.0"
zstd = "0.14.3"

# Networking & Async Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Native Linux GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

# Local SQLite Storage
rusqlite = { version = "0.32", features = ["bundled"] }

[lib]
name = "alolite"
path = "src/lib.rs"

[[bin]]
name = "alolite"
path = "src/main.rs"

[[bin]]
name = "compare"
path = "src/bin/compare.rs"

[[bin]]
name = "probe_media"
path = "src/bin/probe_media.rs"

[[bin]]
name = "test_fetch"
path = "src/bin/test_fetch.rs"

[[bin]]
name = "test_qr_tag"
path = "src/bin/test_qr_tag.rs"

[package.metadata.deb]
name = "alolite"
maintainer = "ngxc <ngoc.dev@gmail.com>"
copyright = "2026, ngxc <ngoc.dev@gmail.com>"
license-file = ["LICENSE-MIT", "0"]
depends = "libc6 (>= 2.31), libx11-6, libxcb1, libxkbcommon0, libgl1"
recommends = "ffmpeg, zenity, xclip, wl-clipboard, fonts-noto-core"
section = "net"
priority = "optional"
assets = [
    ["target/release/alolite", "usr/bin/", "755"],
    ["packaging/linux/alolite.desktop", "usr/share/applications/", "644"],
    ["src/assets/app_icon.png", "usr/share/icons/hicolor/256x256/apps/alolite.png", "644"],
    ["README.md", "usr/share/doc/alolite/README.md", "644"],
]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 0

[profile.test]
debug = 0
