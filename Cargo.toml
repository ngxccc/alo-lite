[workspace]
resolver = "2"
members = [
    "crates/alolite-core",
    "crates/alolite-cli",
    "crates/alolite-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ngxc <ngoc.dev@gmail.com>"]
homepage = "https://github.com/ngxccc/alolite"
repository = "https://github.com/ngxccc/alolite"
license-file = "LICENSE"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 16
panic = "abort"

[profile.dev]
debug = 0

[profile.test]
debug = 0
